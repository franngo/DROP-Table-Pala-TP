name: Java CI with Gradle

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: epersgeist
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: epers_ejemplo_jdbc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mongodb:
        image: mongo
        ports:
          - 27017:27017

      neo4j:
        image: neo4j:latest
        env:
          NEO4J_AUTH: neo4j/rootroot
        ports:
          - 7687:7687

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure environment variables
        run: echo -e "MYSQL_USER=root\nMYSQL_PASSWORD=root\nMYSQL_DATABASE=epersgeist\nNEO_URL=bolt://localhost:7687\nNEO_USER=neo4j\nNEO_PASSWORD=rootroot\nDB_USER=postgres\nDB_PASSWORD=root\nDB_HOST=localhost\nDB_NAME=epers_ejemplo_jdbc\nDB_PORT=5432" >> $GITHUB_ENV

      - name: Wait for Postgres
        run: sleep 10

      - name: Init DB schema
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=root psql -h localhost -U postgres -d epers_ejemplo_jdbc -f createAll.sql

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon
