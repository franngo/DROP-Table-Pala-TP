team.name=DROP-Table-Pala
# PostgreSQL properties
spring.datasource.url=jdbc:postgresql://localhost:5432/epersgeist
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# DDL generation
spring.jpa.generate-ddl=true
#spring.jpa.show-sql=true
# Neo4J properties
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=rootroot
# MongoDB properties
spring.data.mongodb.uri=mongodb://localhost:27017/epersMongo
spring.data.mongodb.database=epersMongo
spring.data.mongodb.auto-index-creation=true
# RavenDB properties
ravendb.url=http://localhost:8090
ravendb.database=EpersRaven
ravendb.certificate=
ravendb.password=
#
# Desactiva el formateo y la impresión directa de SQL en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
# Baja el nivel de log de Hibernate y del Driver SQL para que solo muestren errores
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.engine.spi.TransactionalProcessor=ERROR
# Opcional: Limpia los logs molestos de Neo4j / MongoDB / RavenDB
logging.level.org.springframework.data.neo4j=WARN
logging.level.org.springframework.data.mongodb=WARN=
logging.level.org.springframework.data.neo4j.cypher=ERROR
logging.level.org.springframework.data.neo4j.core.mapping.DefaultNeo4jIsNewStrategy=ERROR
logging.level.org.springframework.data.mapping.context.PersistentProperty=ERROR
logging.level.org.springframework.data.mapping.model=ERROR
logging.level.org.springframework.data.util=ERROR